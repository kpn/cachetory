name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: "🗃 Cache"
        if: success() || failure()
        uses: actions/cache@v5
        with:
          path: .cache
          key: docs

      - uses: actions/checkout@v4
        name: "📥 Checkout"
        with:
          fetch-depth: 0

      - name: "✨ Install Poetry"
        run: pipx install "poetry<2.0.0"

      - uses: actions/setup-python@v6
        name: "✨ Set up Python"
        id: "setup-python"
        with:
          python-version: 3.x
          cache: poetry

      - name: "📥 Install dependencies"
        run: poetry install --no-root --with=docs

      - name: "📦 Build"
        run: make docs

      - name: "📤 Upload"
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: "build"
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "✨ Deploy"
        uses: actions/deploy-pages@v4
